<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body>
    <div>
        <div
            class="h-screen cursor-pointer flex justify-center items-center bg-[url(https://i.pinimg.com/originals/51/09/75/510975d85c0dd78fd4103fd9855b1ec5.gif)] bg-cover bg-center">
            <button onclick="restarGame()" class="bg-sky-200 text-sky-500  px5  py-2 text-center p-10">Retart</button>
            <div class="text-center flex justify-center gap-5">
                <div id="board" class="grid grid-cols-3 p-10 gap-5 shadow-xl rounded-2xl bg-gray-600/10">
            </div>
            </div>
            <div>
                <p id="messge" class="text-bodl text-3xl text-center flex justify-center "></p>
            </div>
        </div>
    </div>
    <script>
        let boardDiv = document.getElementById('board');
        let messge = document.getElementById('messge');
        let boardCells = [
            ["", "", ""],
            ["", "", ""],
            ["", "", ""]
        ];
        let currentPlayer = 'X';
        messge.innerText = "Player X's turn";
        drawboard();
        function drawboard() {
            let boardHTML = '';
            for (let row = 0; row < boardCells.length; row++) {
                for (let col = 0; col < boardCells[row].length; col++) {
                    if (boardCells[row][col] === 'X') {
                        // messge.textContent = `Player ${currentPlayer} win!`;
                        boardHTML += blankCellsX(row, col);
                    } else if (boardCells[row][col] === 'O') {
                        boardHTML += blankCellsO(row, col);
                    } else {
                        boardHTML += blankCells(row, col);
                    }
                }
            }
            boardDiv.innerHTML = boardHTML;
        }
        function cellClicked(row, col) {
            if (boardCells[row][col] === "") {
                boardCells[row][col] = currentPlayer;
                drawboard();
                if  (isWinner(currentPlayer)) {
                    messge.textContent = `Player ${currentPlayer} win!`;
                }else if (isDraw(currentPlayer)) {
                 messge.textContent = `Draw`
                }else{ 
                    if ( currentPlayer === 'X') {
                        
                        currentPlayer = 'O';
                        messge.textContent = "Player O's turn";
                    } else {
                        currentPlayer = 'X';
                        messge.textContent = "Player X's turn";
                    }
                }
            }
        }
        function isWinner(user) {
            //row
            for (let row = 0; row < boardCells.length; row++) {
                if (boardCells[row][0] == user
                    && boardCells[row][1] == user
                    && boardCells[row][2] == user) {
                    return true;
                }

            }
            //para column
            for (let col = 0; col < boardCells.length; col++) {
                if (boardCells[0][col] == user
                    && boardCells[1][col] == user
                    && boardCells[2][col] == user) {
                    return true;
                }

            }
            //para diagonal
            if (boardCells[0][0] == user
                && boardCells[1][1] == user
                && boardCells[2][2] == user) {

                return true;
            }
            if (boardCells[0][0] == user
                && boardCells[1][1] == user
                && boardCells[2][0] == user) {

                return true;
            }
            return false;
            webkitURL = dispatchEvent.apply
        }
        function blankCells(row, col) {
            return `
                <div onclick="cellClicked(${row}, ${col})"
                class="flex items-center justify-center rounded-xl text-3xl hover:bg-gray-100/30 cursor-pointer w-25 h-25 bg-amber-200 duration-200/30 text-sky-500">
                </div>
            `;
        }
        function blankCellsO(row, col) {
            return `
                <div onclick="cellClicked(${row}, ${col})"
                class="flex items-center justify-center rounded-xl text-3xl hover:bg-gray-100/40 cursor-pointer w-25 h-25 bg-amber-200 duration-200/30 text-sky-500">
                    O
                </div>
            `;
        }
        function blankCellsX(row, col) {
            return `
                <div onclick="cellClicked(${row}, ${col})"
                class="flex items-center justify-center rounded-xl text-4xl text-red-600 hover:bg-gray-100/40 cursor-pointer w-25 h-25 bg-amber-200/30 duration-200 text-red-6  00">
                    X
                </div>
            `;
        }
        function restarGame(){
            boardCells = [
                ["", "", ""],
                ["", "", ""],
                ["", "", ""]
            ];
            drawboard();
            messge.textContent = "Player X's turn"
        }
        function isDraw(){
            for(let row = 0; row < boardCells.length; row++){
              for(let col = 0; col < boardCells.length; col++){
                if (boardCells[row][col] ==='') {
                    return false
                }
              }
            }
            return !isWinner('X') && !isWinner ('O');
        }
        Vue.createApp({
            data() {
                return {
                    showText: false,
                    inputPost: '',
                    trash: '',
                    kasoy: '',
                    showTextM: false,
                    frout:[ { id: 0, name: 'penya'},
                    {id: 1, name: 'manggosten'},
                ],
                addFruit: ''
            }
            },
            methods: {
                displayText() {
                    this.showText = true;
                    
                },
                hideText() {
                    this.showText = false;
                    if (this.inputPost === 'niko' && this.trash === '5555') {
                        
                        this.showTextM = true
                        this.showText = false
                    } else {
                        alert('plss tarai agen')
                    }
                },
                showAddFruit(){
                    this.frout.push({id: this.frout.length + 1, name: this.addFruit})
                },
                showRemoveFruit(index){
                    this.frout.splice(this.frout.length -1,1)
                }
                
                
            }
        }).mount('#Opp')
    </script>
</body>

</html>
